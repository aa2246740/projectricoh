<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font:14px/1.55 var(--font-sans,system-ui);color:var(--foreground)}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground);margin:0 0 12px}.swatch{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}.row{display:grid;grid-template-columns:minmax(120px,30%) 1fr;gap:16px;align-items:center;margin:14px 0}.label{font-size:13px}.label small{display:block;font-size:11px;color:var(--muted-foreground);margin-top:3px}.bars{display:grid;gap:8px;padding-right:28px}.track{height:13px;position:relative;background:var(--secondary);border-radius:3px}.bar{display:block;height:100%;border-radius:3px}.value{position:absolute;right:-24px;top:-4px;font:12px/21px var(--font-mono,monospace)}.note{font-size:11px;color:var(--muted-foreground);margin:12px 0 0}@media(max-width:430px){.row{grid-template-columns:118px 1fr;gap:12px}.legend{gap:12px}}
</style></head><body><div aria-label="三种路径的质量门结果"><div class="legend"><span><i class="swatch" style="background:var(--destructive)"></i>训练退步项</span><span><i class="swatch" style="background:var(--warning)"></i>新增夹具失败项</span></div><div class="row"><div class="label">全层 QR<small>540 项 · <span style="color:var(--destructive)">拒绝</span></small></div><div class="bars"><div class="track"><span class="bar" style="width:50.000000%;background:var(--destructive)"></span><span class="value">3</span></div><div class="track"><span class="bar" style="width:66.666667%;background:var(--warning)"></span><span class="value">4</span></div></div></div><div class="row"><div class="label">仅 L3 用 QR<small>900 项 · <span style="color:var(--destructive)">拒绝</span></small></div><div class="bars"><div class="track"><span class="bar" style="width:50.000000%;background:var(--destructive)"></span><span class="value">3</span></div><div class="track"><span class="bar" style="width:100.000000%;background:var(--warning)"></span><span class="value">6</span></div></div></div><div class="row"><div class="label">L3/L4 直接参考 SVD<small>1,530 项 · <span style="color:var(--success)">质量通过</span></small></div><div class="bars"><div class="track"><span class="bar" style="width:0.000000%;background:var(--destructive)"></span><span class="value">0</span></div><div class="track"><span class="bar" style="width:0.000000%;background:var(--warning)"></span><span class="value">0</span></div></div></div><p class="note">相对冻结基准，按现行噪声容差统计训练退步和夹具失败，任一项即拒绝。各行标明覆盖量。直接路径两次完整重建均通过；正式提速和扩展未验收。</p></div></body></html>
