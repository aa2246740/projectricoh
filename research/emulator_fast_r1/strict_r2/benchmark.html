<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}article{background:var(--card);border:1px solid var(--border);padding:16px;border-radius:var(--radius)}p{margin:0 0 12px}.label{font-size:15px}.metric{font-size:38px;font-weight:650;margin-bottom:8px}.metric span{font-size:16px}.muted,.caption{font-size:13px;color:var(--muted-foreground)}.row{display:flex;justify-content:space-between;font-size:14px;margin-top:16px;margin-bottom:7px}.track{height:9px;border-radius:4px;background:var(--secondary);overflow:hidden}.track i{display:block;height:9px;border-radius:4px}.caption{line-height:1.6;margin:14px 0 0}</style></head><body><div class="grid"><article><p class="label">MAIN · 50M 指令</p><p class="metric">65.35<span> 倍</span></p><p class="muted">三对中位 · 范围 58.55–78.27 倍</p><p class="row"><span>批量参考</span><span>98.986 秒</span></p><div class="track"><i style="width:100%;background:var(--chart-2)"></i></div><p class="row"><span>严格原生</span><span>1.515 秒</span></p><div class="track"><i style="width:1.53%;background:var(--chart-1)"></i></div></article><article><p class="label">native_input_run · 50M 指令</p><p class="metric">45.91<span> 倍</span></p><p class="muted">三对中位 · 范围 24.31–46.81 倍</p><p class="row"><span>批量参考</span><span>233.916 秒</span></p><div class="track"><i style="width:100%;background:var(--chart-2)"></i></div><p class="row"><span>严格原生</span><span>5.096 秒</span></p><div class="track"><i style="width:2.18%;background:var(--chart-1)"></i></div></article></div><p class="caption">每项三对交替测量，逐次全状态一致。柱条显示中位倍数对应的一对耗时。输入驱动包含原有检查点写入。其余各对和机器负载见报告。</p></body></html>
