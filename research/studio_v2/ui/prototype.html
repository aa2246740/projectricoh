<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GXR 电脑工作室 v2 · 可点击原型（设计稿，不是正式产品）</title>
<!--
  可点击的静态原型，只为审看设计用，不是正式代码。
  - 图片用 captures/a12-50 里的样本，相对路径引用，没有复制。
  - 效果用浏览器滤镜和 CSS 变换示意；正式版由电脑按同一条管线算出（见 DESIGN.md 第 4、5 节）。
  - 时间、镜头、光圈等文字是示例数据。
  - 所有操作只在这一页里生效，刷新就回到初始状态。
-->
<style>
:root, :root[data-theme=dark] {
  --bg:#121315; --panel:#1b1c1f; --panel2:#25272b; --line:#2f3237; --card:#1f2024;
  --text:#e8e8ea; --dim:#9a9ca3; --acc:#e8b04a; --acc-ink:#e8b04a; --on:#1d1606;
  --ok:#6cc487; --warn:#e0a13a; --bad:#e06a5a; --focus:#e8b04a;
  --stage:#0b0c0d; --demo:#0f1012;
  --amber-bg:#2a2112; --amber-line:#5a4520; --grey-bg:#222326; --grey-line:#3d4046;
  --chip-ok:#2f5a40; --menu-sh:rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme=dark]) {
    --bg:#f3f3f5; --panel:#ffffff; --panel2:#ececef; --line:#d8dadf; --card:#fafafb;
    --text:#1c1d21; --dim:#5d616a; --acc:#b8861f; --acc-ink:#8a5d10; --on:#1d1606;
    --ok:#237a45; --warn:#94600a; --bad:#b42f1f; --focus:#b8861f;
    --stage:#d9dadd; --demo:#e7e7ea;
    --amber-bg:#fbf3e2; --amber-line:#e6cf9a; --grey-bg:#f0f0f2; --grey-line:#c9ccd2;
    --chip-ok:#a9d8b8; --menu-sh:rgba(0,0,0,.14);
  }
}
:root[data-theme=light] {
  --bg:#f3f3f5; --panel:#ffffff; --panel2:#ececef; --line:#d8dadf; --card:#fafafb;
  --text:#1c1d21; --dim:#5d616a; --acc:#b8861f; --acc-ink:#8a5d10; --on:#1d1606;
  --ok:#237a45; --warn:#94600a; --bad:#b42f1f; --focus:#b8861f;
  --stage:#d9dadd; --demo:#e7e7ea;
  --amber-bg:#fbf3e2; --amber-line:#e6cf9a; --grey-bg:#f0f0f2; --grey-line:#c9ccd2;
  --chip-ok:#a9d8b8; --menu-sh:rgba(0,0,0,.14);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column;
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
h2 { font-size: 16px; margin: 0 0 4px; }
p { margin: 6px 0; }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.hidden { display: none !important; }

button {
  font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 11px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--dim); }
button[aria-disabled=true] { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--acc); border-color: var(--acc); color: var(--on); font-weight: 600; }
button.ghost { background: none; border-color: transparent; color: var(--dim); }
button.danger { color: var(--bad); }
button[aria-pressed=true] { border-color: var(--acc); color: var(--acc-ink); }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
input[type=range] { accent-color: var(--acc); width: 100%; margin: 4px 0; }
input[type=checkbox] { accent-color: var(--acc); }
input[type=text], input[type=date] {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; width: 100%;
}
kbd {
  font: 12px ui-monospace, Menlo, monospace; background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 5px; padding: 0 5px;
}

/* 演示条（正式版没有这一行） */
.demo {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 6px 12px; background: var(--demo);
  border-bottom: 1px dashed var(--line); font-size: 12px; flex: none;
}
.demo .label { color: var(--dim); }
.demo .grp { display: flex; align-items: center; gap: 4px; }
.demo button { font-size: 12px; padding: 2px 8px; }

/* 顶栏 */
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 0 14px; height: 52px; flex: none;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font-weight: 700; letter-spacing: .3px; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: none; border-color: transparent; color: var(--dim); }
.tabs button.on { background: var(--panel2); color: var(--text); }
.top-actions { margin-left: auto; display: flex; gap: 8px; }

/* 屏幕 */
.screen { display: none; flex: 1; min-height: 0; }
.screen.on { display: flex; }

/* 大图：照片条、舞台、侧栏、底栏 */
#scr-viewer { flex-direction: column; }
.photobar {
  display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 42px; flex: none; font-size: 13px;
  border-bottom: 1px solid var(--line);
}
.photobar .count { margin-left: auto; color: var(--dim); font-size: 12px; }
.vbody { flex: 1; min-height: 0; display: flex; }
.stagecol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stage-area {
  flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center;
  background: var(--stage); overflow: hidden; padding: 24px;
}
.status {
  height: 34px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 12px;
  border-top: 1px solid var(--line); background: var(--panel);
}
.status .right { margin-left: auto; color: var(--dim); }
.chip {
  display: inline-block; font-size: 12px; border-radius: 999px; padding: 0 9px; border: 1px solid var(--line); white-space: nowrap;
}
.chip.ok { color: var(--ok); border-color: var(--ok); }
.chip.warn { color: var(--warn); border-color: var(--warn); }
.chip.grey { color: var(--dim); }
.badge { font-size: 11px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.badge.raw { color: var(--ok); border-color: var(--ok); }
.badge.jpg { color: var(--dim); }

.side {
  width: 380px; flex: none; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0;
}
.side-tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.side-tabs button {
  flex: 1; background: none; border: 0; border-radius: 0; color: var(--dim); padding: 11px 0; font-size: 14px;
  border-bottom: 2px solid transparent; min-width: 0;
}
.side-tabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--acc); }
.side-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
.pane h2 { margin-bottom: 2px; }
.sec { margin: 14px 0 4px; font-size: 13px; color: var(--dim); }
.sec:first-of-type { margin-top: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.seg button { font-size: 13px; }
.row { margin: 10px 0; }
.row .lab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; }
.row output { min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
.ends span:last-child { text-align: right; }
.notice {
  border: 1px solid var(--amber-line); background: var(--amber-bg); border-radius: 10px; padding: 9px 12px; margin: 10px 0; font-size: 13px;
}
.notice.grey { border-color: var(--grey-line); background: var(--grey-bg); }
.dimmed { opacity: .45; }
.notice.flash { animation: flash .45s ease-in-out; }
@keyframes flash { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.notice-line { font-size: 12px; color: var(--warn); margin: 6px 0 0; min-height: 0; }
.bases { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
.bases button { text-align: left; font-size: 13px; padding: 6px 9px; }
.knob { margin: 8px 0; }
.knob .lab { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.knob .lab span.grow { flex: 1; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--amber-line); color: var(--acc-ink); }
.tag.soft { color: var(--dim); border-color: var(--line); }
.foot { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; }
.fine { font-size: 12px; color: var(--dim); margin: 4px 0; }
.hint-now { font-size: 12px; color: var(--warn); min-height: 18px; margin: 4px 0; }

/* 裁切：拉直刻度盘 */
.ruler {
  position: relative; height: 46px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; cursor: ew-resize; user-select: none; margin: 6px 0;
}
.ruler .tick { position: absolute; bottom: 0; width: 1px; height: 9px; background: var(--dim); }
.ruler .tick.l { height: 16px; }
.ruler .tick.n { height: 26px; background: var(--text); }
.ruler .tnum { position: absolute; top: 4px; font-size: 11px; color: var(--dim); transform: translateX(-50%); }
.ruler .pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--acc); }
.ruler.out { opacity: .6; }

/* 弹出菜单 */
.menu {
  position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
  box-shadow: 0 12px 32px var(--menu-sh); min-width: 230px; max-height: 60vh; overflow-y: auto;
}
.menu .mt { font-size: 12px; color: var(--dim); padding: 6px 8px 2px; }
.menu .mi {
  display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px;
}
.menu .mi:hover { background: var(--panel2); }
.menu .mi[aria-selected=true] { color: var(--acc-ink); font-weight: 600; }

/* 边框、时间戳的缩略卡 */
.fcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; }
.fcard {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px; text-align: center; cursor: pointer;
  color: var(--text); font-size: 12px;
}
.fcard[aria-pressed=true] { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.fcard .thumb { height: 74px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 6px; background: var(--stage); }
.fcard .nm { margin-top: 4px; }
.fcard.none .thumb { background: var(--card); border: 1px dashed var(--line); color: var(--dim); font-size: 12px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(127,127,127,.5); }
.sw[aria-pressed=true] { outline: 2px solid var(--acc); outline-offset: 2px; }
.swrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.corner { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 180px; margin: 6px 0; }
.corner button { font-size: 12px; padding: 5px 4px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; font-size: 13px; }
.fmts { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
.fmts label {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  font-size: 13px; background: var(--card);
}
.fmts label[data-on=true] { border-color: var(--acc); }
.fmts .ex { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }

/* 调节：曲线 */
.curve { width: 220px; height: 220px; background: var(--stage); border: 1px solid var(--line); border-radius: 8px; touch-action: none; display: block; margin: 6px 0; }
.curve .cd { stroke: var(--dim); stroke-dasharray: 4 4; stroke-width: 1; }
.curve .cl { fill: none; stroke: var(--acc); stroke-width: 2; }
.curve .cp { fill: var(--acc); stroke: var(--on); stroke-width: 1.5; cursor: grab; }

/* 导出 */
.export-list { margin: 8px 0; padding: 0; list-style: none; font-size: 13px; }
.export-list li { padding: 3px 0; }
.export-list li::before { content: "✓ "; color: var(--ok); }

/* 预览画面（成片预览 / 裁切中 / 原图） */
.pv { position: relative; overflow: hidden; flex: none; }
.pv-win { position: absolute; overflow: hidden; }
.pv-cv { position: absolute; }
.pv-img { position: absolute; max-width: none; user-select: none; pointer-events: none; }
.pv-vig { position: absolute; inset: 0; pointer-events: none; }
.pv-stamp { position: absolute; white-space: pre; pointer-events: none; line-height: 1; }
.pv-txt { position: absolute; white-space: pre; line-height: 1.1; pointer-events: none; }
.pv-line { position: absolute; background: currentColor; opacity: .4; pointer-events: none; }
.fade-in { animation: fadein .15s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* 裁切框 */
.crop-box {
  position: absolute; border: 2px solid var(--acc); box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; touch-action: none;
}
.crop-box .guides { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; transition: opacity .25s; }
.crop-box .guides line, .crop-box .guides path { stroke: #fff; stroke-opacity: .85; stroke-width: 1; fill: none; vector-effect: non-scaling-stroke; }
.crop-box[data-fade=true][data-moving=false] .guides { opacity: .35; }
.crop-box .h {
  position: absolute; width: 14px; height: 14px; background: var(--acc); border: 2px solid #fff; border-radius: 3px; margin: -7px 0 0 -7px; cursor: nwse-resize;
}
.crop-box .h.tl { left: 0; top: 0; cursor: nwse-resize; }
.crop-box .h.tr { left: 100%; top: 0; margin-left: -7px; cursor: nesw-resize; }
.crop-box .h.bl { left: 0; top: 100%; cursor: nesw-resize; }
.crop-box .h.br { left: 100%; top: 100%; margin-left: -7px; cursor: nwse-resize; }

/* 底栏 */
.bottombar {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px; height: 46px; flex: none; border-top: 1px solid var(--line); background: var(--panel);
}
.bottombar .spacer { flex: 1; }

/* 边框一览、三种裁切 */
.grid-screen { flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; padding: 18px; }
.gs-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.gs-head p { margin: 0; }
.gs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.gs-item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.gs-box { height: 290px; display: flex; align-items: center; justify-content: center; background: var(--stage); border-radius: 6px; overflow: hidden; }
.gs-item .cap { font-size: 13px; margin-top: 8px; }
.gs-item .cap .dim { font-size: 12px; }

/* 帮助弹层 */
.layer { position: fixed; inset: 0; z-index: 50; }
.modal-ov { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal {
  width: min(560px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
table.keys { border-collapse: collapse; width: 100%; font-size: 13px; }
table.keys td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.keys td:first-child { width: 160px; white-space: nowrap; }

.toast {
  position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 70; background: var(--panel2);
  border: 1px solid var(--line); padding: 7px 16px; border-radius: 99px; font-size: 13px; box-shadow: 0 8px 24px var(--menu-sh);
  pointer-events: none; max-width: 90vw;
}
</style>
</head>
<body>

<div class="demo" id="demo"></div>

<header class="topbar">
  <div class="brand">GXR 电脑工作室</div>
  <nav class="tabs" id="tabs">
    <button type="button" data-go="photos">照片</button>
    <button type="button" data-go="recipes">配方</button>
    <button type="button" data-go="camera">相机</button>
  </nav>
  <div class="top-actions">
    <button type="button" id="btn-export">导出</button>
    <button type="button" class="ghost" id="btn-settings" title="设置（⌘,）">设置</button>
    <button type="button" class="ghost" id="btn-help" title="快捷键（?）">?</button>
  </div>
</header>

<section class="screen on" id="scr-viewer">
  <div class="photobar" id="photobar"></div>
  <div class="vbody">
    <div class="stagecol">
      <div class="stage-area" id="stage-area"></div>
      <div class="status" id="status"></div>
    </div>
    <aside class="side">
      <div class="side-tabs" id="side-tabs"></div>
      <div class="side-body" id="side-body"></div>
    </aside>
  </div>
  <div class="bottombar" id="bottombar"></div>
</section>

<section class="screen grid-screen" id="scr-frames"></section>
<section class="screen grid-screen" id="scr-crops"></section>

<div class="layer" id="layer"></div>

<script>
(() => {
'use strict';

/* ---------- 常量（示例数据、选项、文案） ---------- */

const NS = 'http://www.w3.org/2000/svg';
const PHI = (1 + Math.sqrt(5)) / 2;
const ZERO = { straighten: 0, vertical: 0, horizontal: 0, distortion: 0, rot: 0, flip: false };

// 示例照片：文件是 captures/a12-50 里的相机 JPG，相对路径，没有复制。时间、镜头、参数是示例数据。
const PHOTOS = [

const BW_HIDE = ['saturation', 'warmth', 'tint', 'split'];

// 比例。L 是横向的比例（宽 / 高，≥1）；o 是默认方向（l 横 / p 竖）；1:1、原比例、自由不分横竖。
const PRESET_GROUPS = [
  { title: '常用', items: [
    { id: 'original', label: '原比例', L: null },
    { id: 'free', label: '自由', L: null },
    { id: '1:1', label: '1:1', L: 1 },
    { id: '3:2', label: '3:2', L: 1.5, o: 'l' },
    { id: '4:3', label: '4:3', L: 4 / 3, o: 'l' },
    { id: '16:9', label: '16:9', L: 16 / 9, o: 'l' },

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'style') Object.assign(n.style, v);
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, String(v));
    }
  }
  for (const c of kids.flat()) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
function svgEl(tag, attrs) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
  return n;
}

function snapshot() {

}
function pushUndo(snap) {

}
function beginEdit() { if (!S.pending) S.pending = snapshot(); }
function endEdit() {
  if (S.pending && S.pending !== snapshot()) pushUndo(S.pending);
  S.pending = null;
}
function undo() {
  const s = S.undo.pop();

}

/* ---------- 几何：画布、有效区域、裁切框 ---------- */

// 画布（按旋转后的方向）。画面和裁切框都在这块画布上。
function canvasDims(p, rot) { return rot % 2 ? [p.h, p.w] : [p.w, p.h]; }

// 拉直以后，画布上哪些点还有画面：以画布中心为原点，反向转 deg 再看是否落在原图范围内
function inValid(x, y, cw, ch, deg) {
  const dx = x - cw / 2;
  const dy = y - ch / 2;
  const t = (deg * Math.PI) / 180;
  const c = Math.cos(t);
  const s = Math.sin(t);
  const qx = dx * c + dy * s;
  const qy = -dx * s + dy * c;
  return Math.abs(qx) <= cw / 2 + 1e-6 && Math.abs(qy) <= ch / 2 + 1e-6;
}

// 裁切框收进有效画面里（以框的中心为准等比缩小）。原型只看拉直，透视的有效区域正式版由后端给出。
function fitRect(r, p = P(), rot = S.geo.rot, deg = S.geo.straighten) {
  const [cw, ch] = canvasDims(p, rot);
  const ok = (q) => {
    const xs = [q.x * cw, (q.x + q.w) * cw];
    const ys = [q.y * ch, (q.y + q.h) * ch];
    return xs.every((x) => ys.every((y) => inValid(x, y, cw, ch, deg)));
  };
  if (ok(r)) return { rect: r, shrunk: false };
  const cx = r.x + r.w / 2;
  const cy = r.y + r.h / 2;
  const scaled = (t) => ({ x: cx - (r.w * t) / 2, y: cy - (r.h * t) / 2, w: r.w * t, h: r.h * t });
  let lo = 0;
  let hi = 1;
  for (let i = 0; i < 30; i++) {
    const mid = (lo + hi) / 2;
    if (ok(scaled(mid))) lo = mid;
    else hi = mid;
  }
  return { rect: scaled(lo), shrunk: true };
}

// 画布上最大的、居中的、指定比例的框（r 为 null 时用画布本身的比例）
function maxRect(p, r, rot = S.geo.rot, deg = S.geo.straighten) {
  const [cw, ch] = canvasDims(p, rot);
  const a = r == null ? cw / ch : r;
  let W;
  let H;
  if (cw / ch > a) { H = ch; W = a * ch; } else { W = cw; H = W / a; }
  const rect = { x: (cw - W) / 2 / cw, y: (ch - H) / 2 / ch, w: W / cw, h: H / ch };
  return fitRect(rect, p, rot, deg).rect;
}

function presetItem(id) { return PRESET_ALL.find((x) => x.id === id) || null; }
function orientable(it) { return !!it && it.L != null && it.L !== 1 && it.id !== 'original' && it.id !== 'free'; }
// 当前比例（宽 / 高）。原比例、自由返回 null
function currentRatio() {
  const it = presetItem(S.crop.preset);
  if (!it || it.L == null) return null;
  return S.crop.portrait ? 1 / it.L : it.L;
}

function applyPreset(id) {
  beginEdit();
  const it = presetItem(id);
  S.crop.preset = id;
  S.crop.portrait = !!(it && it.o === 'p');
  if (id === 'free') S.crop.rect = fitRect(S.crop.rect).rect;
  else S.crop.rect = maxRect(P(), currentRatio());
  S.zoom = 100;
  endEdit();
  renderAll();
}

function toggleOrientation() {
  if (!orientable(presetItem(S.crop.preset))) return;
  beginEdit();
  S.crop.portrait = !S.crop.portrait;
  S.crop.rect = maxRect(P(), currentRatio());
  S.zoom = 100;
  endEdit();
  renderAll();
}

function applyZoom(z) {
  S.zoom = z;
  const m = maxRect(P(), currentRatio());
  const r = S.crop.rect;
  const cx = r.x + r.w / 2;
  const cy = r.y + r.h / 2;
  const w = m.w * (z / 100);
  const h = m.h * (z / 100);
  const next = { x: clamp(cx - w / 2, 0, 1 - w), y: clamp(cy - h / 2, 0, 1 - h), w, h };
  const c = fitRect(next);
  S.crop.rect = c.rect;
  noteShrunk(c.shrunk);
}

// 旋转 90°（逆时针）：框跟着画面转，坐标换算，不重算
function rotate90() {
  beginEdit();
  S.geo.rot = (S.geo.rot + 1) % 4;
  const r = S.crop.rect;
  const moved = { x: r.y, y: 1 - r.x - r.w, w: r.h, h: r.w };
  const c = fitRect(moved);
  S.crop.rect = c.rect;
  noteShrunk(c.shrunk);
  endEdit();
  renderAll();
}

// 左右翻转：框跟着翻；拉直的值不变（先转后翻，摆正的仍然摆正）
function flipH() {
  beginEdit();
  S.geo.flip = !S.geo.flip;
  const r = S.crop.rect;
  const c = fitRect({ x: 1 - r.x - r.w, y: r.y, w: r.w, h: r.h });
  S.crop.rect = c.rect;
  endEdit();
  renderAll();
}

function setStraighten(v) {
  S.geo.straighten = clamp(Math.round(v * 10) / 10, -45, 45);
  const c = fitRect(S.crop.rect);
  S.crop.rect = c.rect;
  noteShrunk(c.shrunk);
}

function resetCropAndGeo() {
  beginEdit();
  S.geo = DEFAULT_GEO();
  S.crop = { preset: 'original', portrait: false, rect: { x: 0, y: 0, w: 1, h: 1 } };
  S.zoom = 100;
  endEdit();
  renderAll();
  toast('已还原裁切和纠正');
}

// 自动：示意（真正的地平线检测在后端）
function autoCorrect() {
  const seed = P().id.charCodeAt(P().id.length - 1) % 3;
  if (seed === 0) {
    toast('没找到明显的水平线，没有改动');
    paintStatus();
    return;
  }
  beginEdit();
  setStraighten(seed === 1 ? 1.2 : -0.8);
  S.geo.vertical = seed === 1 ? -3 : 2;
  endEdit();
  renderAll();
  toast(`已拉直 ${fmtDeg(S.geo.straighten)}，垂直 ${fmtSigned(S.geo.vertical)}。可以再调，或用撤销。`);
}

/* ---------- 颜色（示意） ---------- */

function recipeApplies() {
  if (S.demo === 'full') return true;
  if (S.demo === 'approx') return S.recipe.chosen;
  return false;
}
function colorFilter() {
  const parts = [];
  const applies = recipeApplies();
  const lv = applies ? S.recipe.levels : {};
  if (applies && S.recipe.slot !== 4) parts.push(BASES[S.recipe.slot - 1].css);
  const a = S.adj;
  const ev = clamp(a.exposure, -2, 2);
  if (ev) parts.push(`brightness(${(2 ** ev).toFixed(3)})`);
  const contrast = clamp(1 + (a.contrast + a.highlight * 0.3 - a.shadow * 0.2) / 200 + (lv.contrast || 0) / 80, 0.5, 1.8);
  if (Math.abs(contrast - 1) > 0.001) parts.push(`contrast(${contrast.toFixed(3)})`);
  const sat = clamp(1 + a.sat / 125 + a.vib / 250 + (lv.saturation || 0) / 40, 0, 2.2);
  if (Math.abs(sat - 1) > 0.001) parts.push(`saturate(${sat.toFixed(3)})`);
  if (a.warm > 0) parts.push(`sepia(${((a.warm / 100) * 0.35).toFixed(3)})`);
  if (a.warm < 0) parts.push(`hue-rotate(${((a.warm / 100) * 12).toFixed(1)}deg)`);
  return parts.join(' ') || 'none';
}
function vignetteBg() {
  const v = S.adj.vignette;
  if (!v) return null;
  if (v < 0) return `radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,${((-v / 100) * 0.85).toFixed(3)}) 100%)`;
  return `radial-gradient(ellipse at center, rgba(255,255,255,0) 45%, rgba(255,255,255,${((v / 100) * 0.5).toFixed(3)}) 100%)`;
}

/* ---------- 边框、时间戳（示意） ---------- */

function frameColors(name) {
  if (name === 'black') return { bg: '#111214', ink: '#f2f2f4', sub: '#8d9097' };
  if (name === 'cream') return { bg: '#f2ead8', ink: '#2a2620', sub: '#7a7163' };
  return { bg: '#ffffff', ink: '#1b1c1f', sub: '#6b6e75' };
}

// 边框的四边宽度（单位：照片的像素，和照片同一把尺子）。L 是窗口长边，m 是短边。
function frameSpec(f, W, H) {
  const none = { l: 0, r: 0, t: 0, b: 0, bg: null, ink: '#000', sub: '#000' };
  if (!f || f.style === 'none') return none;
  const L = Math.max(W, H);
  const m = Math.min(W, H);
  const C = frameColors(f.color);
  switch (f.style) {
    case 'gallery': {
      const p = { thin: 0.02, mid: 0.04, thick: 0.07 }[f.weight] * L;
      return { l: p, r: p, t: p, b: p + (f.text ? p * 1.6 : 0), ...C, bg: C.bg };
    }
    case 'leica': return { l: 0, r: 0, t: 0, b: 0.09 * m, ...C, bg: C.bg };
    case 'hasselblad': {
      const side = { thin: 0.02, mid: 0.03, thick: 0.045 }[f.weight] * L;
      return { l: side, r: side, t: side, b: 0.12 * L, ...C, bg: C.bg };
    }
    case 'film': return { l: 0.045 * L, r: 0.045 * L, t: 0.045 * L, b: 0.075 * L, bg: '#0d0d0e', ink: '#e9a24a', sub: '#c98a3c' };
    case 'instant': return { l: 0.035 * L, r: 0.035 * L, t: 0.035 * L, b: 0.2 * L, ...C, bg: C.bg };
    case 'canvas': {
      const R = CANVAS_RATIOS[f.canvas_ratio] || 0.8;
      const mg = 0.04 * L;
      const needW = W + 2 * mg;
      const needH = H + 2 * mg;
      let CW;
      let CH;
      if (needW / needH > R) { CW = needW; CH = CW / R; } else { CH = needH; CW = CH * R; }
      const sx = (CW - W) / 2;
      const sy = (CH - H) / 2;
      return { l: sx, r: sx, t: sy, b: sy, ...C, bg: C.bg };
    }
    default: return none;
  }
}

// 时间戳的文字（只用拍摄时间，或用户改过的日期）
function stampText(p, st) {
  const parts = [];
  const d = st.date_override || p.date;
  const [Y, M, D] = d.split('-');
  const yy = Y.slice(2);
  if (st.content !== 'text') {
    let s;
    switch (st.date_format) {
      case 'yy mm dd': s = `${yy} ${M} ${D}`; break;
      case 'yyyy.mm.dd': s = `${Y}.${M}.${D}`; break;
      case "mm dd 'yy": s = `${M} ${D} '${yy}`; break;
      default: s = `'${yy} ${M} ${D}`;
    }
    if (st.show_time) s += ` ${p.time}`;
    parts.push(s);
  }
  if (st.content !== 'date' && st.text) parts.push(st.text);
  return parts.join('  ');
}

function fontCss(name) {
  if (name === 'typewriter') return '"Courier New", Courier, monospace';
  if (name === 'sans') return '-apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif';
  return '"DSEG7 Classic", Menlo, Consolas, monospace';
}

/* ---------- 画面：一张照片的成片、未裁切、原图 ---------- */

// o: { p, mode: 'final'|'uncropped'|'orig', geo, rect, frame, stamp, fitW, fitH, overlayable }
function buildView(o) {
  const { p, mode, fitW, fitH } = o;
  const orig = mode === 'orig';
  const g = orig ? ZERO : o.geo;
  const [cw, ch] = canvasDims(p, g.rot);
  const rect = mode === 'final' ? o.rect : { x: 0, y: 0, w: 1, h: 1 };
  const W = rect.w * cw;
  const H = rect.h * ch;
  const X = rect.x * cw;
  const Y = rect.y * ch;
  const spec = mode === 'final' ? frameSpec(o.frame, W, H) : { l: 0, r: 0, t: 0, b: 0, bg: null };
  const TW = spec.l + W + spec.r;
  const TH = spec.t + H + spec.b;
  const s = Math.max(0.02, Math.min(fitW / TW, fitH / TH));

  const outer = el('div', { class: 'pv fade-in', style: { width: px(TW * s), height: px(TH * s), background: spec.bg || 'transparent' } });
  const win = el('div', { class: 'pv-win', style: { left: px(spec.l * s), top: px(spec.t * s), width: px(W * s), height: px(H * s) } });
  const cv = el('div', { class: 'pv-cv', style: { left: px(-X * s), top: px(-Y * s), width: px(cw * s), height: px(ch * s) } });

  const corr = `translate(-50%,-50%) perspective(2400px) rotateX(${(-g.vertical * 0.3).toFixed(2)}deg) rotateY(${(g.horizontal * 0.3).toFixed(2)}deg) scaleX(${g.flip ? -1 : 1}) rotate(${(g.straighten - 90 * g.rot).toFixed(3)}deg)`;
  const img = el('img', {
    class: 'pv-img', src: p.src, alt: '', draggable: 'false',
    style: {
      left: orig ? '0px' : '50%', top: orig ? '0px' : '50%',
      width: px(p.w * s), height: px(p.h * s),
      transform: orig ? 'none' : corr,
      filter: orig ? 'none' : colorFilter(),
    },
  });
  cv.append(img);
  const vig = orig ? null : vignetteBg();
  if (vig) cv.append(el('div', { class: 'pv-vig', style: { background: vig } }));
  win.append(cv);

  if (mode === 'final' && o.stamp.enabled) {
    const m = Math.min(W, H);
    const size = STAMP_SIZES[o.stamp.size][1] * m * s;
    const mg = 0.035 * m * s;
    const st = el('div', {
      class: 'pv-stamp',
      style: {
        fontFamily: fontCss(o.stamp.font), fontSize: px(size), fontWeight: o.stamp.font === 'seg7' ? '700' : '400',
        color: STAMP_COLORS[o.stamp.color][1], letterSpacing: o.stamp.font === 'seg7' ? '0.08em' : '0.02em',
        textShadow: o.stamp.glow ? `0 0 ${(size * 0.12).toFixed(1)}px rgba(255,120,40,.85), 0 0 ${(size * 0.5).toFixed(1)}px rgba(255,90,20,.45)` : 'none',
        ...stampPos(o.stamp.corner, mg),
      },
    }, stampText(p, o.stamp));
    win.append(st);
  }
  outer.append(win);

  if (mode === 'final') decorFrame(outer, o.frame, spec, W, H, s);
  return { el: outer, s, cw, ch, W, H, X, Y, spec };
}

function stampPos(corner, mg) {
  const pos = {};
  if (corner.includes('t')) pos.top = px(mg); else pos.bottom = px(mg);
  if (corner.includes('l')) pos.left = px(mg); else pos.right = px(mg);
  return pos;
}

// 边框上的文字和信息条（位置按边框四边算）
function decorFrame(outer, f, spec, W, H, s) {
  if (!f || f.style === 'none') return;
  const TW = (spec.l + W + spec.r) * s;
  const TH = (spec.t + H + spec.b) * s;
  const bandTop = (spec.t + H) * s;
  const bandH = spec.b * s;
  const ink = spec.ink;
  const sub = spec.sub;
  const bandText = (cls, styleExtra) => el('div', { class: cls, style: styleExtra });

  if (f.style === 'leica') {
    const bar = el('div', { style: { position: 'absolute', left: '0', top: px(bandTop), width: px(TW), height: px(bandH), display: 'flex', alignItems: 'center', padding: `0 ${px(bandH * 0.45)}`, gap: px(bandH * 0.4), color: ink, background: spec.bg } });
    const left = el('div', { style: { display: 'flex', alignItems: 'baseline', gap: px(bandH * 0.14), whiteSpace: 'nowrap' } });
    if (f.show_logo) left.append(el('span', { style: { fontWeight: '800', fontSize: px(bandH * 0.36), letterSpacing: '0.04em', fontFamily: 'Helvetica Neue, Arial, sans-serif' } }, 'RICOH'));
    left.append(el('span', { style: { fontSize: px(bandH * 0.24), fontWeight: '600', letterSpacing: '0.08em' } }, 'GXR'));
    bar.append(left);
    if (f.show_params) {
      bar.append(el('div', { style: { width: px(Math.max(1, s * 2)), height: px(bandH * 0.55), background: sub, opacity: '0.6' } }));
      const col = el('div', { style: { display: 'flex', flexDirection: 'column', whiteSpace: 'nowrap', lineHeight: '1.35' } });
      col.append(el('span', { style: { fontSize: px(bandH * 0.22), fontWeight: '600' } }, P().lens));
      const line2 = `${P().fnum}  ${P().shutter}  ISO ${P().iso}${f.show_date ? `  ·  ${P().date.replace(/-/g, '.')}` : ''}`;
      col.append(el('span', { style: { fontSize: px(bandH * 0.18), color: sub } }, line2));
      bar.append(col);
    } else if (f.show_date) {
      bar.append(el('span', { style: { marginLeft: 'auto', fontSize: px(bandH * 0.2), color: sub } }, P().date.replace(/-/g, '.')));
    }
    outer.append(bar);
    return;
  }

  if (f.style === 'hasselblad') {
    const box = el('div', { style: { position: 'absolute', left: '0', top: px(bandTop), width: px(TW), height: px(bandH), display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: px(bandH * 0.08), color: ink, pointerEvents: 'none' } });
    if (f.show_logo) box.append(el('div', { style: { fontSize: px(bandH * 0.2), letterSpacing: '0.28em', fontWeight: '700' } }, 'RICOH GXR'));
    const parts = [];
    if (f.show_params) parts.push(`${P().lens.replace(' F2.5 MACRO', '')}  ·  ${P().fnum}  ·  ${P().shutter}  ·  ISO ${P().iso}`);
    if (f.show_date) parts.push(P().date.replace(/-/g, '.'));
    if (parts.length) box.append(el('div', { style: { fontSize: px(bandH * 0.13), color: sub, whiteSpace: 'nowrap' } }, parts.join('   ')));
    outer.append(box);
    return;
  }

  if (f.style === 'film') {
    const row = el('div', { style: { position: 'absolute', left: px(spec.l * s), width: px(W * s), top: px(bandTop), height: px(bandH), display: 'flex', alignItems: 'center', justifyContent: 'space-between', color: ink, fontFamily: '"Courier New", Courier, monospace', fontSize: px(bandH * 0.3), letterSpacing: '0.08em' } });
    const bits = [];
    if (f.show_logo) bits.push('RICOH GXR');
    if (f.show_params) bits.push('A12 50mm');
    row.append(el('span', { style: { color: ink, opacity: '0.95' } }, bits.join(' · ')));
    if (f.show_frame_no) row.append(el('span', { style: { color: sub } }, P().frameNo));
    outer.append(row);
    return;
  }

  if (f.style === 'instant' && f.text) {
    outer.append(el('div', { class: 'pv-txt', style: { left: '0', width: px(TW), top: px(bandTop + bandH * 0.36), textAlign: 'center', color: ink, fontFamily: 'Kaiti SC, STKaiti, 楷体, cursive', fontSize: px(bandH * 0.3) } }, f.text));
    return;
  }

  if (f.style === 'gallery' && f.text) {
    outer.append(el('div', { class: 'pv-txt', style: { left: '0', width: px(TW), top: px(bandTop + bandH * 0.36), textAlign: 'center', color: ink, fontSize: px(bandH * 0.3) } }, f.text));
  }
}

// 裁切框（只在裁切中出现）
function cropBox(v) {
  const r = S.crop.rect;
  const box = el('div', {
    class: 'crop-box', 'data-fade': String(S.guides.fade), 'data-moving': 'false',
    style: { left: pct(r.x), top: pct(r.y), width: pct(r.w), height: pct(r.h) },
  });
  box.append(guidesSvg(r, v));
  for (const c of ['tl', 'tr', 'bl', 'br']) box.append(el('i', { class: `h ${c}`, 'data-h': c }));
  box.addEventListener('pointerdown', (e) => onBoxDown(e, v, box));
  return box;
}

function paintBox(box, v) {
  const r = S.crop.rect;
  box.style.left = pct(r.x);
  box.style.top = pct(r.y);
  box.style.width = pct(r.w);
  box.style.height = pct(r.h);
  box.dataset.fade = String(S.guides.fade);
  const old = box.querySelector('svg.guides');
  if (old) old.replaceWith(guidesSvg(r, v));
}

function guidesSvg(r, v) {
  const svg = svgEl('svg', { class: 'guides', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
  const g = S.guides;
  if (g.guide === 'off') { svg.style.display = 'none'; return svg; }
  const ar = Math.max(0.01, (r.w * v.cw) / (r.h * v.ch));
  svg.setAttribute('viewBox', `0 0 ${ar} 1`);
  const { lines, path } = guideShapes(g.guide, g.spiral, ar);
  for (const [x1, y1, x2, y2] of lines) svg.append(svgEl('line', { x1, y1, x2, y2 }));
  if (path) svg.append(svgEl('path', { d: path }));
  return svg;
}

const GOLD_SMALL = 1 - 1 / PHI;
const GOLD_BIG = 1 / PHI;
function guideShapes(guide, spiral, ar) {
  const lines = [];
  const at = (fracs) => {
    for (const f of fracs) {
      lines.push([f * ar, 0, f * ar, 1]);
      lines.push([0, f, ar, f]);
    }
  };
  switch (guide) {
    case 'thirds': at([1 / 3, 2 / 3]); break;
    case 'golden': at([GOLD_SMALL, GOLD_BIG]); break;
    case 'diagonal': lines.push([0, 0, ar, 1], [ar, 0, 0, 1]); break;
    case 'cross': at([0.5]); break;
    case 'grid': at([0.25, 0.5, 0.75]); break;
    case 'spiral': return { lines, path: spiralPath(spiral, ar) };
    default: break;
  }
  return { lines, path: '' };
}
function spiralPath(k, ar) {
  const sx = k & 1 ? -1 : 1;
  const sy = k & 2 ? -1 : 1;
  const px0 = (sx > 0 ? GOLD_BIG : GOLD_SMALL) * ar;
  const py0 = sy > 0 ? GOLD_SMALL : GOLD_BIG;
  let d = '';
  for (let u = -9; u <= 0.6 + 1e-9; u += 0.02) {
    const r = 0.9 * PHI ** u;
    const th = (u * Math.PI) / 2;
    const x = px0 + sx * r * Math.cos(th);
    const y = py0 + sy * r * Math.sin(th);
    d += `${d ? 'L' : 'M'}${x.toFixed(4)} ${y.toFixed(4)}`;
  }
  return d;
}

// 裁切框拖动：移动、四角缩放（比例锁定时保持比例）；松手时保存
function onBoxDown(e, v, box) {
  if (e.button !== 0) return;
  e.preventDefault();
  const corner = e.target && e.target.dataset ? e.target.dataset.h : undefined;
  box.setPointerCapture(e.pointerId);
  beginEdit();
  box.dataset.moving = 'true';
  const start = { x: e.clientX, y: e.clientY, rect: { ...S.crop.rect } };
  const outerRect = box.parentElement.getBoundingClientRect();
  const lock = S.crop.preset === 'free' ? null : (currentRatio() ?? v.cw / v.ch);

  const onMove = (ev) => {
    let r;
    if (!corner) {
      const dx = (ev.clientX - start.x) / (v.cw * v.s);
      const dy = (ev.clientY - start.y) / (v.ch * v.s);
      r = { ...start.rect, x: clamp(start.rect.x + dx, 0, 1 - start.rect.w), y: clamp(start.rect.y + dy, 0, 1 - start.rect.h) };
    } else {
      const Px = (ev.clientX - outerRect.left) / outerRect.width;
      const Py = (ev.clientY - outerRect.top) / outerRect.height;
      const sr = start.rect;
      const ax = corner.includes('l') ? sr.x + sr.w : sr.x;
      const ay = corner.includes('t') ? sr.y + sr.h : sr.y;
      let w = Math.max(0.05, Math.abs(Px - ax));
      let h = Math.max(0.05, Math.abs(Py - ay));
      if (lock) h = Math.max(0.05, (w * v.cw) / lock / v.ch);
      r = { x: corner.includes('l') ? ax - w : ax, y: corner.includes('t') ? ay - h : ay, w, h };
    }
    const c = fitRect(r);
    S.crop.rect = c.rect;
    if (c.shrunk) noteShrunk(true);
    paintBox(box, v);
    paintPixels();
  };
  const onUp = () => {
    box.removeEventListener('pointermove', onMove);
    endEdit();
    renderStage();
    touchSaved();
  };
  box.addEventListener('pointermove', onMove);
  box.addEventListener('pointerup', onUp, { once: true });
  box.addEventListener('pointercancel', onUp, { once: true });
}

/* ---------- 舞台、状态行 ---------- */

function stageMode() {
  if (S.showOriginal) return 'orig';
  return S.tab === 'crop' ? 'uncropped' : 'final';
}

function renderStage() {
  const area = $('#stage-area');
  const mode = stageMode();
  const fitW = Math.max(60, area.clientWidth - 48);
  const fitH = Math.max(60, area.clientHeight - 48);
  const v = buildView({ p: P(), mode, geo: S.geo, rect: S.crop.rect, frame: S.frame, stamp: S.stamp, fitW, fitH });
  area.replaceChildren(v.el);
  if (mode === 'uncropped') v.el.append(cropBox(v));
  paintStatus();
  UI.lastView = v;
}

function chipInfo() {
  if (S.showOriginal) return null;
  if (S.demo === 'full') return { text: '电脑预测', cls: 'ok' };
  if (S.demo === 'approx' && S.recipe.chosen) return { text: '近似（这张没有 RAW）', cls: 'warn' };
  return null;
}

function paintStatus() {
  const st = $('#status');
  const mode = stageMode();
  const chip = chipInfo();
  const left = [];
  if (chip) left.push(el('span', { class: `chip ${chip.cls}` }, chip.text));
  const text = mode === 'orig'
    ? '看的是原图：没有任何编辑。松开空格键恢复。'
    : mode === 'uncropped'
      ? '裁切中：这是整张画面，亮框里是会保留的部分。'
      : '成片预览：配方、调节、裁切、边框、时间戳都在里面，就是导出的样子。';
  left.push(el('span', { class: 'dim' }, text));
  const right = S.busy ? '正在预览…' : (S.shrunk && mode === 'uncropped' ? '框已收进有效画面' : '已保存');
  st.replaceChildren(...left, el('span', { class: 'right' }, right));
}

// 框被收进有效画面时提示 2 秒
function noteShrunk(flag) {
  if (!flag) return;
  S.shrunk = true;
  clearTimeout(noteShrunk.timer);
  noteShrunk.timer = setTimeout(() => { S.shrunk = false; paintStatus(); }, 2000);
}

function paintPixels() {
  if (!UI.pixels) return;
  UI.pixels.textContent = pixelsText();
}

function pixelsText() {
  const p = P();
  if (!S.crop.rect) return '';
  const [cw, ch] = canvasDims(p, S.geo.rot);
  const pw = Math.round(S.crop.rect.w * cw);
  const ph = Math.round(S.crop.rect.h * ch);
  const it = presetItem(S.crop.preset);
  const name = it ? it.label : '';
  const dir = pw >= ph ? '横' : '竖';
  const ratioPart = it && it.L != null ? `${name}（${dir}）` : name;
  return `当前：${ratioPart}，裁出 ${pw} × ${ph} 像素`;
}

function renderPhotoBar() {
  const p = P();
  const badge = S.demo === 'full'
    ? el('span', { class: 'badge raw' }, 'RAW+JPG 一对')
    : el('span', { class: 'badge jpg' }, '只有 JPG');

  // replaceChildren 会把 null 当成文字 "null"，所以先去掉空的

function renderBottom() {
  $('#bottombar').replaceChildren(
    el('button', { type: 'button', onclick: undo }, '↶ 撤销'),
    el('button', { type: 'button', onclick: resetAll, title: '清掉这张照片的所有编辑，原图不动' }, '全部还原'),
    el('span', { class: 'spacer' }),
    el('button', { type: 'button', disabled: S.photo <= 0 || null, 'aria-disabled': S.photo <= 0 ? 'true' : null, onclick: () => step(-1) }, '‹ 上一张'),
    el('button', { type: 'button', 'aria-disabled': S.photo >= PHOTOS.length - 1 ? 'true' : null, onclick: () => step(1) }, '下一张 ›'),
  );
}

function resetAll() {
  pushUndo();
  S.geo = DEFAULT_GEO();
  S.crop = { preset: 'original', portrait: false, rect: { x: 0, y: 0, w: 1, h: 1 } };
  S.adj = { exposure: 0, contrast: 0, highlight: 0, shadow: 0, black: 0, warm: 0, tint: 0, sat: 0, vib: 0, vignette: 0, curve: 0 };
  S.recipe = { chosen: false, slot: 4, amount: 100, levels: {} };
  S.frame = DEFAULT_FRAME();
  S.stamp = DEFAULT_STAMP();
  renderAll();
  toast('已还原，可以用撤销找回来');
}

function step(d) {
  const next = S.photo + d;
  if (next < 0 || next >= PHOTOS.length) return;
  S.photo = next;
  S.undo = [];
  S.geo = DEFAULT_GEO();
  S.crop = { preset: 'original', portrait: false, rect: { x: 0, y: 0, w: 1, h: 1 } };
  S.adj = { exposure: 0, contrast: 0, highlight: 0, shadow: 0, black: 0, warm: 0, tint: 0, sat: 0, vib: 0, vignette: 0, curve: 0 };
  S.recipe = { chosen: false, slot: 4, amount: 100, levels: {} };
  S.frame = DEFAULT_FRAME();
  S.stamp = DEFAULT_STAMP();
  renderAll();
}

const TABS = [
  ['recipe', '配方', 'R'],
  ['adjust', '调节', 'A'],
  ['crop', '裁切', 'C'],
  ['frame', '边框', 'F'],
  ['stamp', '时间戳', 'T'],
  ['export', '导出', 'E'],
];
const TAB_TITLE = { recipe: '配方', adjust: '调节', crop: '裁切与纠正', frame: '边框', stamp: '时间戳', export: '导出' };

// 进入「裁切」时记下从哪个标签来的，「完成」时回到那里
function setTab(id) {
  if (S.tab === id) return;
  if (id === 'crop') S.lastTab = S.tab;
  S.tab = id;
  renderAll();
}

function renderTabs() {
  const box = $('#side-tabs');
  box.replaceChildren(...TABS.map(([id, label, key]) => el('button', {
    type: 'button', role: 'tab', 'aria-selected': String(S.tab === id), title: `${TAB_TITLE[id]}（${key}）`,
    onclick: () => { if (id === 'crop' && S.tab !== 'crop') S.lastTab = S.tab; setTab(id); },
  }, label)));
}

function renderSide() {
  renderTabs();
  const body = $('#side-body');
  body.replaceChildren();
  const pane = {
    recipe: paneRecipe, adjust: paneAdjust, crop: paneCrop, frame: paneFrame, stamp: paneStamp, export: paneExport,
  }[S.tab]();
  body.append(pane);
}

/* ---------- 侧栏：配方 ---------- */

function paneRecipe() {
  const p = P();
  const wrap = el('div', { class: 'pane' });
  wrap.append(el('h2', null, '配方'), el('p', { class: 'dim small' }, '底子是相机里的风格，你在它上面微调。'));

  let noticeEl = null;
  if (S.demo === 'approx') {
    noticeEl = el('div', { class: 'notice' }, el('strong', null, '近似'), '：这张照片没有 RAW（原始文件）。下面的配方是用 JPG 近似算出来的，和 RAW 拍出来的会有差别。');
  }
  if (S.demo === 'none') {
    noticeEl = el('div', { class: 'notice grey' },
      el('div', { style: { fontWeight: '600', marginBottom: '4px' } }, '这张照片用不了配方'),
      el('div', null, '这张只有 JPG，没有 RAW（原始文件），配方需要 RAW 才能算。'),
      el('div', null, '以后拍的时候把画质设成 ', el('strong', null, 'RAW+JPEG'), '，就能套配方了。'),
      el('div', { class: 'dim small', style: { marginTop: '4px' } }, '裁切、纠正、调节、边框、时间戳照常可以用。'),
    );
  }
  if (noticeEl) wrap.append(noticeEl);
  UI.notice = noticeEl;
  UI.noticeHint = el('div', { class: 'notice-line' }, '');
  wrap.append(UI.noticeHint);

  wrap.append(el('p', { class: 'small dim' }, `这张照片是 ${p.lens} 拍的，用它的底子。`));

  const dis = S.demo === 'none';
  const grid = el('div', { class: 'bases' });
  for (const b of BASES) {
    grid.append(el('button', {
      type: 'button', class: 'base', 'aria-pressed': String(S.recipe.slot === b.slot && S.recipe.chosen),
      'aria-disabled': dis ? 'true' : null,
      title: dis ? '这张只有 JPG，所以配方按钮不能用。' : (b.stock ? '原厂 04：没选配方时用它' : ''),
      onclick: () => {
        if (dis) { flashNone(); return; }
        beginEdit();
        if (!(S.recipe.slot === b.slot && S.recipe.chosen)) {
          S.recipe = { chosen: true, slot: b.slot, amount: S.recipe.amount, levels: {} };
        }
        endEdit();
        renderAll();
      },
    }, `${pad2(b.slot)} ${b.name}`, b.stock ? el('span', { class: 'dim small' }, ' 原厂') : null));
  }
  wrap.append(el('div', { class: 'sec' }, '8 个底子'), grid);

  // 整体强度和微调：「不能用」时整块变淡，点了（捕获阶段拦住）给出原因，不会没反应
  const rest = el('div', { class: dis ? 'dimmed' : null });
  if (dis) rest.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); flashNone(); }, true);
  wrap.append(rest);
  rest.append(sliderRow({
    label: '整体强度', min: 0, max: 150, step: 1, get: () => S.recipe.amount, dflt: 100,
    set: (v) => { S.recipe.amount = v; }, fmt: (v) => `${v}%`,
    ends: ['0%：原厂 04 标准', '100%：配方原样'], disabled: dis, onAfter: () => {},
  }));

  rest.append(el('div', { class: 'sec' }, '微调（每项 −9 到 +9，0 是原样）'));
  for (const k of KNOBS) {
    if (k.bwOnly && S.recipe.slot !== 3) continue;
    if (S.recipe.slot === 3 && BW_HIDE.includes(k.key)) continue;
    if (S.recipe.slot !== 3 && k.bwOnly) continue;
    rest.append(knobRow(k, dis));
  }
  rest.append(el('p', { class: 'fine' }, '相机的这个版本只认 ±5：对比、高光、阴影、饱和度。褪色、冷暖、品绿、分离色调、黑白滤镜只在电脑上生效。'));

  rest.append(el('div', { class: 'foot' },
    el('button', {
      type: 'button', 'aria-disabled': dis ? 'true' : null, onclick: () => {
        if (dis) { flashNone(); return; }
        beginEdit(); S.recipe = { chosen: S.recipe.chosen, slot: S.recipe.slot, amount: 100, levels: {} }; endEdit(); renderAll(); toast('微调已全部归零，整体强度保留');
      },
    }, '全部归零'),
    el('button', { type: 'button', 'aria-disabled': 'true', title: '原型里还没有这个功能' }, '存为我的配方（即将推出）'),
  ));
  return wrap;
}

function flashNone() {
  const n = UI.notice;
  if (n) {
    n.classList.remove('flash');
    void n.offsetWidth;
    n.classList.add('flash');
  }
  if (UI.noticeHint) UI.noticeHint.textContent = '这张只有 JPG，所以配方按钮不能用。';
}

function knobRow(k, dis) {
  const lv = S.recipe.levels;
  const cur = lv[k.key] || 0;
  const out = el('output', null, fmtSigned(cur));
  const input = el('input', { type: 'range', min: -9, max: 9, step: 1, value: cur, 'aria-label': k.name, 'aria-disabled': dis ? 'true' : null });
  input.addEventListener('pointerdown', () => { if (!dis) beginEdit(); });
  input.addEventListener('input', () => {
    if (dis) return;
    S.recipe.levels = { ...S.recipe.levels, [k.key]: Number(input.value) };
    out.textContent = fmtSigned(Number(input.value));
    renderStage();
    touchSaved();
  });
  input.addEventListener('change', () => { if (!dis) endEdit(); });
  input.addEventListener('dblclick', () => {
    if (dis) return;
    beginEdit();
    S.recipe.levels = { ...S.recipe.levels, [k.key]: 0 };
    endEdit();
    renderAll();
  });
  const tag = k.tag.startsWith('相机') ? el('span', { class: 'tag' }, k.tag) : el('span', { class: 'tag soft' }, k.tag);
  return el('div', { class: 'knob' },
    el('div', { class: 'lab' }, el('span', { class: 'grow' }, k.name), tag, out),
    input,
  );
}

function curveEditor() {
  const holder = el('div', null);
  const svg = svgEl('svg', { class: 'curve', viewBox: '0 0 255 255', role: 'group', 'aria-label': '主曲线' });
  const paint = () => {
    const mid = S.adj.curve;
    const my = 128 + mid;
    svg.replaceChildren(
      svgEl('rect', { x: 0, y: 0, width: 255, height: 255, fill: 'transparent' }),
      svgEl('line', { x1: 0, y1: 255, x2: 255, y2: 0, class: 'cd' }),
      svgEl('path', { d: `M0 255 Q 128 ${255 - my} 255 0`, class: 'cl' }),
      svgEl('circle', { cx: 128, cy: 255 - my, r: 7, class: 'cp', 'data-c': '1' }),
    );
  };
  paint();
  let drag = false;
  const toLocal = (e) => {
    const r = svg.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * 255, (e.clientY - r.top) / r.height * 255];
  };
  svg.addEventListener('pointerdown', (e) => {
    drag = true;
    beginEdit();
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const [, y] = toLocal(e);
    S.adj.curve = clamp(Math.round(128 - (y - 128)), -60, 60);
    paint();
    renderStage();
  });
  const end = () => { if (drag) { drag = false; endEdit(); touchSaved(); } };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('dblclick', () => { beginEdit(); S.adj.curve = 0; endEdit(); renderAll(); });
  holder.append(svg);
  return holder;
}

/* 通用滑块：label 行（名称 + 数值）+ 滑块 + 两端说明 */
function sliderRow({ label, min, max, step, key, get, set, dflt, fmt, ends, disabled, onAfter }) {
  const read = get || (() => S.adj[key]);
  const write = set || ((v) => { S.adj[key] = v; });
  const cur = read();
  const out = el('output', null, fmt(cur));
  const input = el('input', { type: 'range', min, max, step, value: cur, 'aria-label': label, 'aria-disabled': disabled ? 'true' : null });
  input.addEventListener('pointerdown', () => { if (!disabled) beginEdit(); });
  input.addEventListener('keydown', () => { if (!disabled && !S.pending) beginEdit(); });
  input.addEventListener('input', () => {
    if (disabled) return;
    write(Number(input.value));
    out.textContent = fmt(read());
    renderStage();
    touchSaved();
  });
  const finish = () => { if (!disabled) { endEdit(); if (onAfter) onAfter(); } };
  input.addEventListener('change', finish);
  input.addEventListener('keyup', finish);
  input.addEventListener('dblclick', () => {
    if (disabled) return;
    beginEdit();
    write(dflt);
    input.value = dflt;
    out.textContent = fmt(dflt);
    endEdit();
    renderStage();
  });
  const endRow = ends ? el('div', { class: 'ends' }, el('span', null, ends[0]), el('span', null, ends[1])) : null;
  return el('div', { class: 'row' }, el('div', { class: 'lab' }, el('span', null, label), out), input, endRow);
}

// 刻度盘：拖动转动（12px 一度），显示中心两侧约 ±15°
function ruler() {
  const box = el('div', {
    class: 'ruler', tabindex: '0', role: 'slider', 'aria-label': '拉直', 'aria-valuemin': -45, 'aria-valuemax': 45,
    'aria-valuenow': S.geo.straighten, 'aria-valuetext': fmtDeg(S.geo.straighten),
  });
  box.append(el('div', { class: 'pointer' }));
  UI.ruler = box;
  paintRuler();
  let drag = null;
  box.addEventListener('pointerdown', (e) => {
    box.setPointerCapture(e.pointerId);
    beginEdit();
    drag = { x: e.clientX, v: S.geo.straighten };
  });
  box.addEventListener('pointermove', (e) => {
    if (!drag) return;
    setStraighten(drag.v + (e.clientX - drag.x) / 12);
    refreshAngle();
  });
  const up = () => { if (drag) { drag = null; endEdit(); touchSaved(); renderStage(); paintPixels(); } };
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);
  box.addEventListener('dblclick', () => { beginEdit(); setStraighten(0); endEdit(); refreshAngle(); });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      beginEdit();
      setStraighten(S.geo.straighten + (e.key === 'ArrowRight' ? 0.1 : -0.1));
      endEdit();
      refreshAngle();
    }
  });
  box.addEventListener('keyup', () => { endEdit(); });
  return box;
}

function refreshAngle() {
  if (UI.angleOut) UI.angleOut.textContent = fmtDeg(S.geo.straighten);
  if (UI.ruler) {
    UI.ruler.setAttribute('aria-valuenow', String(S.geo.straighten));
    UI.ruler.setAttribute('aria-valuetext', fmtDeg(S.geo.straighten));
    paintRuler();
  }
  renderStage();
  paintPixels();
  touchSaved();
}

function paintRuler() {
  const box = UI.ruler;
  if (!box) return;
  [...box.querySelectorAll('.tick, .tnum')].forEach((n) => n.remove());
  const W = box.clientWidth || 340;
  const c = W / 2;
  const v = S.geo.straighten;
  const PXD = 12;
  for (let d = Math.floor(v - c / PXD) - 1; d <= Math.ceil(v + c / PXD) + 1; d++) {
    if (d < -45 || d > 45) continue;
    const x = c + (d - v) * PXD;
    if (x < -2 || x > W + 2) continue;
    const cls = d % 10 === 0 ? 'tick n' : d % 5 === 0 ? 'tick l' : 'tick';
    box.append(el('div', { class: cls, style: { left: px(x) } }));
    if (d % 10 === 0) box.append(el('div', { class: 'tnum', style: { left: px(x) } }, String(d)));
  }
  box.classList.toggle('out', Math.abs(v) >= 45);
}

// 比例菜单
function openPresetMenu(anchor) {
  const groups = PRESET_GROUPS.map((g) => ({
    title: g.title,
    items: g.items.map((x) => ({ id: x.id, label: x.label, on: x.id === S.crop.preset })),
  }));
  openMenu(anchor, groups, (id) => applyPreset(id));
}

function openGuideMenu(anchor) {
  const groups = [{ items: GUIDES.map(([id, label]) => ({ id, label, on: S.guides.guide === id })) }];
  openMenu(anchor, groups, (id) => {
    S.guides.guide = id;
    renderStage();
    renderSide();
  });
}

function openMenu(anchor, groups, onPick) {
  closeMenus();
  const r = anchor.getBoundingClientRect();
  const m = el('div', { class: 'menu', role: 'listbox', style: { left: px(Math.min(r.left, window.innerWidth - 250)), top: px(r.bottom + 6) } });
  for (const g of groups) {
    if (g.title) m.append(el('div', { class: 'mt' }, g.title));
    for (const it of g.items) {
      m.append(el('button', {
        type: 'button', class: 'mi', role: 'option', 'aria-selected': String(!!it.on),
        onclick: () => { closeMenus(); onPick(it.id); },
      }, it.label));
    }
  }
  document.body.append(m);
  menuEl = m;
}
function closeMenus() {
  if (menuEl) menuEl.remove();
  menuEl = null;
}

  wrap.append(el('label', { class: 'switch-row' }, el('strong', null, '显示时间戳'),
    el('input', { type: 'checkbox', checked: on, onchange: (e) => set({ enabled: e.target.checked }) })));

  const dis = !on;
  const group = (children) => el('div', { style: { opacity: dis ? '0.45' : '1', pointerEvents: dis ? 'none' : 'auto' } }, children);
  const inner = [];

  inner.push(el('div', { class: 'sec' }, '内容'));
  inner.push(el('div', { class: 'seg' }, ...[['date', '日期'], ['text', '文字'], ['both', '日期加文字']].map(([id, lab]) => {

    return el('button', { type: 'button', 'aria-pressed': String(st.content === mapped), onclick: () => set({ content: mapped }) }, lab);
  })));

  if (st.content !== 'text') {
    inner.push(el('div', { class: 'sec' }, '日期格式'));
    inner.push(el('div', { class: 'fmts' }, DATE_FORMATS.map((f) => {
      const on2 = st.date_format === f.id;

        el('input', { type: 'radio', name: 'dfmt', checked: on2, onchange: () => set({ date_format: f.id }) }),

        el('span', { class: 'ex' }, ''));
    })));
    inner.push(el('label', { class: 'switch-row' }, '加上时间（如 14:05）',
      el('input', { type: 'checkbox', checked: st.show_time, onchange: (e) => set({ show_time: e.target.checked }) })));
    const dateNow = st.date_override || P().date;
    const dateInput = el('input', { type: 'date', value: dateNow, 'aria-label': '日期', onchange: (e) => set({ date_override: e.target.value || null }) });
    inner.push(el('div', { class: 'sec' }, '日期'));
    inner.push(el('div', { class: 'fine' }, P().dateFromExif ? '日期来自拍摄时间。' : '这张照片没有拍摄时间，用的是文件修改时间。'));
    inner.push(el('div', { class: 'seg', style: { alignItems: 'center' } }, dateInput,
      st.date_override ? el('button', { type: 'button', onclick: () => set({ date_override: null }) }, '恢复拍摄日期') : null));
  }

  if (st.content !== 'date') {
    inner.push(el('div', { class: 'sec' }, '文字'));
    const txt = el('input', { type: 'text', value: st.text, placeholder: '例如 TOKYO 或 GXR', maxlength: '24', 'aria-label': '时间戳文字' });
    txt.addEventListener('change', () => set({ text: txt.value.trim() }));
    inner.push(txt);
    inner.push(el('div', { class: 'fine' }, '最多 24 个字。'));
  }

  inner.push(el('div', { class: 'sec' }, '样子'));
  inner.push(el('div', { class: 'seg' }, el('span', { class: 'small dim', style: { alignSelf: 'center', width: '40px' } }, '字体'),
    ...Object.entries(STAMP_FONTS).map(([id, lab]) => el('button', { type: 'button', 'aria-pressed': String(st.font === id), onclick: () => set({ font: id }) }, lab))));
  inner.push(el('div', { class: 'swrow' }, el('span', { class: 'small dim', style: { width: '40px' } }, '颜色'),
    ...Object.entries(STAMP_COLORS).map(([id, [lab, hex]]) => el('button', {
      type: 'button', class: 'sw', 'aria-pressed': String(st.color === id), 'aria-label': lab, title: lab,
      style: { background: hex }, onclick: () => set({ color: id }),
    }))));
  inner.push(el('div', { class: 'seg' }, el('span', { class: 'small dim', style: { alignSelf: 'center', width: '40px' } }, '大小'),
    ...Object.entries(STAMP_SIZES).map(([id, [lab]]) => el('button', { type: 'button', 'aria-pressed': String(st.size === id), onclick: () => set({ size: id }) }, lab))));
  inner.push(el('div', { class: 'seg', style: { alignItems: 'center' } }, el('span', { class: 'small dim', style: { width: '40px' } }, '位置'),
    el('div', { class: 'corner' }, ...Object.entries(STAMP_CORNERS).map(([id, lab]) => el('button', {
      type: 'button', 'aria-pressed': String(st.corner === id), onclick: () => set({ corner: id }),
    }, lab)))));
  inner.push(el('label', { class: 'switch-row' }, '发光', el('input', { type: 'checkbox', checked: st.glow, onchange: (e) => set({ glow: e.target.checked }) })));

  wrap.append(group(inner));
  wrap.append(el('div', { class: 'foot' }, el('button', { type: 'button', class: 'primary', onclick: setDefaults }, '设为默认')));
  wrap.append(el('p', { class: 'fine' }, '和边框一起存为默认。以后新照片和批量导出都用这套设置。'));
  return wrap;
}

/* ---------- 侧栏：导出（只示意） ---------- */

function paneExport() {
  const wrap = el('div', { class: 'pane' });
  wrap.append(el('h2', null, '导出'));
  wrap.append(el('p', { class: 'small dim' }, '导出的就是成片预览的样子。'));
  const items = [];
  if (S.demo === 'full') items.push('配方（电脑预测）');
  else if (S.demo === 'approx' && S.recipe.chosen) items.push('配方（近似，这张没有 RAW）');
  if (Object.values(S.adj).some((v) => v)) items.push('调节');
  if (S.geo.straighten || S.geo.vertical || S.geo.horizontal || S.geo.distortion || S.geo.rot || S.geo.flip || S.crop.preset !== 'original') items.push('裁切与纠正');
  if (S.frame.style !== 'none') items.push(`边框：${FRAMES.find((f) => f.id === S.frame.style).name}`);
  if (S.stamp.enabled) items.push('时间戳');
  wrap.append(el('div', { class: 'sec' }, '这次会导出：'));
  wrap.append(el('ul', { class: 'export-list' }, items.length ? items.map((t) => el('li', null, t)) : [el('li', { class: 'dim' }, '照片本身（没有任何编辑）')]));
  wrap.append(el('div', { class: 'sec' }, '尺寸'));
  wrap.append(el('div', { class: 'seg' }, ...['原始', '长边 3000', '长边 2048', '长边 1600'].map((t, i) => el('button', { type: 'button', 'aria-pressed': String(i === 0) }, t))));
  wrap.append(sliderRow({ label: '质量', min: 60, max: 100, step: 1, get: () => 85, set: () => {}, dflt: 85, fmt: (v) => `${v}（${v >= 90 ? '高' : v >= 80 ? '中' : '低'}）` }));
  wrap.append(el('div', { class: 'fine' }, '这次导出用的边框和时间戳，是这张照片自己的设置；没有单独设置的照片，用默认的。'));
  wrap.append(el('div', { class: 'foot' }, el('button', { type: 'button', class: 'primary', onclick: () => toast('原型不导出真文件') }, '开始导出')));
  return wrap;
}

/* ---------- 示意条：其它两个屏幕 ---------- */

function renderFrames() {
  const box = $('#scr-frames');
  const p = P();
  const head = el('div', { class: 'gs-head' },
    el('h2', null, '六种边框，同一张照片'),
    el('span', { class: 'dim small' }, '示例用的时间戳和文字都是示意。边框粗细按照片长边算，所以样式之间比例一致。'),
  );
  const grid = el('div', { class: 'gs-grid' });
  for (const f of FRAMES) {
    const text = f.id === 'instant' ? '今天也很好' : '';
    const v = buildView({
      p, mode: 'final', geo: ZERO, rect: { x: 0, y: 0, w: 1, h: 1 },
      frame: { ...FRAME_DEFAULT, style: f.id, text },
      stamp: { ...S.stamp, enabled: true, text: '', content: 'date' },
      fitW: 300, fitH: 270,
    });
    grid.append(el('div', { class: 'gs-item' },
      el('div', { class: 'gs-box' }, v.el),
      el('div', { class: 'cap' }, el('strong', null, f.name), ' ', el('span', { class: 'dim' }, styleNote(f.id))),
    ));
  }
  box.replaceChildren(head, grid);
}

function styleNote(id) {
  return {
    none: '原照片', gallery: '四边等宽', leica: '底部信息条', hasselblad: '下边宽', film: '黑边、橙字', instant: '下边特别宽', canvas: '固定比例画布',
  }[id] || '';
}

function renderCrops() {
  const box = $('#scr-crops');
  const p = P();
  const sel = el('div', { class: 'seg' }, ...FRAMES.map((f) => el('button', {
    type: 'button', 'aria-pressed': String(S.cropsStyle === f.id), onclick: () => { S.cropsStyle = f.id; renderCrops(); },
  }, f.name)));
  const cases = [
    { label: '原比例 3:2', r: null },
    { label: '1:1 方图', r: 1 },
    { label: '4:5 竖图', r: 0.8 },
  ];
  const grid = el('div', { class: 'gs-grid', style: { gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))' } });
  for (const c of cases) {
    const rect = maxRect(p, c.r, 0, 0);
    const v = buildView({
      p, mode: 'final', geo: ZERO, rect,
      frame: { ...FRAME_DEFAULT, style: S.cropsStyle, text: S.cropsStyle === 'instant' ? '今天也很好' : '' },
      stamp: { ...S.stamp, enabled: true, content: 'date' },
      fitW: 300, fitH: 320,
    });
    grid.append(el('div', { class: 'gs-item' },
      el('div', { class: 'gs-box', style: { height: '350px' } }, v.el),
      el('div', { class: 'cap' }, el('strong', null, c.label)),
    ));
  }
  box.replaceChildren(
    el('div', { class: 'gs-head' }, el('h2', null, '同一张照片，换三种裁切'), el('span', { class: 'dim small' }, '选一种边框看看：不管怎么裁，边框都整齐、比例一致。')),
    sel,
    grid,
  );
}

/* ---------- 顶部、演示条 ---------- */

function renderDemo() {
  const demo = $('#demo');
  const grp = (label, opts, cur, onPick) => el('div', { class: 'grp' }, el('span', { class: 'label' }, label),
    ...opts.map(([id, text]) => el('button', { type: 'button', 'aria-pressed': String(cur === id), onclick: () => onPick(id) }, text)));
  const theme = document.documentElement.dataset.theme || 'auto';
  demo.replaceChildren(
    el('strong', null, '原型演示条'), el('span', { class: 'dim' }, '（正式版没有这一行）'),
    grp('颜色', [['auto', '跟随系统'], ['light', '浅色'], ['dark', '深色']], theme, (id) => {
      if (id === 'auto') delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = id;
      renderDemo();
    }),
    grp('这张照片', [['full', '有 RAW'], ['approx', '只有 JPG · 可近似'], ['none', '只有 JPG · 不能用']], S.demo, (id) => {
      S.demo = id; renderAll();
    }),
    grp('看哪里', [['viewer', '大图（可操作）'], ['frames', '六种边框'], ['crops', '三种裁切']], S.screen, (id) => {
      S.screen = id; renderAll();
    }),
    el('span', { class: 'dim' }, '示例照片：' + PHOTOS.map((p, i) => (i === S.photo ? `【${p.id}】` : p.id)).join('  ')),
    el('button', { type: 'button', onclick: () => { S.photo = (S.photo + 1) % PHOTOS.length; S.undo = []; S.geo = DEFAULT_GEO(); S.crop = { preset: 'original', portrait: false, rect: { x: 0, y: 0, w: 1, h: 1 } }; renderAll(); } }, '换一张'),
  );
}

function renderTop() {
  $('#tabs').querySelectorAll('button').forEach((b) => b.classList.toggle('on', S.screen === 'viewer' && b.dataset.go === 'photos'));
}

function showHelp() {
  closeModal();
  const rows = [
    ['R · A · C · F · T · E', '配方 · 调节 · 裁切 · 边框 · 时间戳 · 导出'],
    ['← / →', '上一张 / 下一张（滑块获得焦点时只动滑块）'],
    ['空格键（按住）', '看原图，松开恢复'],
    ['↑ / ↓', '裁切中：拉直每次 0.5°；其它：滑块上每次 1 格'],
    ['G / O', '裁切中：换构图辅助线 / 换螺旋方向'],
    ['[', '裁切中：逆时针转 90°（新增，可以不做）'],
    ['双击滑块', '归零'],
    ['⌘Z', '撤销'],
    ['⌘E', '导出'],
    ['?', '显示这个表'],
  ];
  const modal = el('div', { class: 'modal' },
    el('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '8px' } }, el('h2', null, '快捷键'), el('button', { type: 'button', class: 'ghost', style: { marginLeft: 'auto' }, onclick: closeModal }, '✕')),
    el('table', { class: 'keys' }, rows.map(([k, v]) => el('tr', null, el('td', null, el('kbd', null, k)), el('td', null, v)))),
  );
  const ov = el('div', { class: 'modal-ov', id: 'modal-ov', onclick: (e) => { if (e.target === ov) closeModal(); } }, modal);
  $('#layer').replaceChildren(ov);
}
function closeModal() {
  const ov = document.getElementById('modal-ov');
  if (ov) ov.remove();
}

/* ---------- 渲染入口 ---------- */

function renderAll() {
  closeMenus();
  renderDemo();
  renderTop();
  const show = (id) => {
    for (const s of ['viewer', 'frames', 'crops']) {
      document.getElementById(`scr-${s}`).classList.toggle('on', s === id);
    }
  };
  show(S.screen);
  if (S.screen === 'viewer') {
    renderPhotoBar();
    renderSide();
    renderStage();
    renderBottom();
  } else if (S.screen === 'frames') {
    renderFrames();
  } else {
    renderCrops();
  }
}

function setTabKey(key) {
  const map = { r: 'recipe', a: 'adjust', c: 'crop', f: 'frame', t: 'stamp', e: 'export' };
  const id = map[key.toLowerCase()];
  if (!id) return false;
  if (id === 'crop' && S.tab !== 'crop') S.lastTab = S.tab;
  setTab(id);
  return true;
}

function isSliderFocus() {
  const a = document.activeElement;
  return !!a && ((a.tagName === 'INPUT' && a.type === 'range') || a.classList.contains('ruler'));
}

document.addEventListener('keydown', (e) => {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' && (a.type === 'text' || a.type === 'date'))) return;
  if (e.metaKey || e.ctrlKey) {
    if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undo(); }
    if (e.key === 'e' || e.key === 'E') { e.preventDefault(); if (S.screen === 'viewer') setTab('export'); }
    return;
  }
  if (e.key === '?') { showHelp(); return; }
  if (e.key === 'Escape') { closeModal(); closeMenus(); if (S.screen !== 'viewer') { S.screen = 'viewer'; renderAll(); } return; }
  if (S.screen !== 'viewer') return;
  if (e.key === ' ') {
    if (isSliderFocus()) return;
    e.preventDefault();
    if (!e.repeat && !S.showOriginal) { S.showOriginal = true; renderStage(); }
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (isSliderFocus()) return;
    e.preventDefault();
    step(e.key === 'ArrowLeft' ? -1 : 1);
    return;
  }
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && S.tab === 'crop' && !isSliderFocus()) {
    e.preventDefault();
    beginEdit();
    setStraighten(S.geo.straighten + (e.key === 'ArrowUp' ? 0.5 : -0.5));
    endEdit();
    refreshAngle();
    return;
  }
  if (S.tab === 'crop' && (e.key === 'g' || e.key === 'G')) {
    const ids = GUIDES.map((g) => g[0]);
    S.guides.guide = ids[(ids.indexOf(S.guides.guide) + 1) % ids.length];
    renderSide();
    renderStage();
    return;
  }
  if (S.tab === 'crop' && (e.key === 'o' || e.key === 'O')) {
    S.guides.spiral = (S.guides.spiral + 1) % 4;
    renderStage();
    return;
  }
  if (S.tab === 'crop' && e.key === '[') { rotate90(); return; }
  if (!isSliderFocus()) setTabKey(e.key);
});
document.addEventListener('keyup', (e) => {
  if (e.key === ' ' && S.showOriginal) {
    S.showOriginal = false;
    renderStage();
  }
});
document.addEventListener('pointerdown', (e) => {
  if (menuEl && !menuEl.contains(e.target)) closeMenus();
});

$('#btn-export').addEventListener('click', () => { if (S.screen !== 'viewer') { S.screen = 'viewer'; renderAll(); } setTab('export'); });
$('#btn-settings').addEventListener('click', () => toast('设置在正式版里，原型不演示'));
$('#btn-help').addEventListener('click', showHelp);
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.go === 'photos') { S.screen = 'viewer'; renderAll(); return; }
  toast('原型只演示大图，配方页和相机页请看正式版');
});

new ResizeObserver(() => { if (S.screen === 'viewer') renderStage(); }).observe($('#stage-area'));

renderAll();
})();
</script>
</body>
