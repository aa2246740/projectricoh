<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{margin:0;font-family:var(--font-sans);color:var(--foreground,#233044)}p{font-size:13px;line-height:1.5;margin:8px 0}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}.main{color:var(--chart-1,#2166ac)}.input{color:var(--chart-2,#9c6500)}.note{color:var(--muted-foreground,#657083)}#chart{height:300px;width:100%}</style></head><body>
<div class="legend"><span class="main">MAIN · 逐对中位 62.44 倍</span><span class="input">输入驱动 · 逐对中位 31.38 倍</span></div>
<div id="chart"></div><p class="note">每项五对，reference/native 交替；每次实跑 50M 步并核对完整终态。虚线为原报告的 65.35 / 45.91 倍。</p><p class="note">本轮主机有负载，不能确认空闲条件下的精确倍率。MAIN 只计执行；输入驱动含构造和原有检查点保存，扣除额外审计导出。</p>
<script>const data={"main": {"ratios": [53.5938122406603, 62.69456976129654, 62.44368912354957, 64.63579858641391, 51.31594624963775], "median": 62.44368912354957, "range": [51.31594624963775, 64.63579858641391], "reference": {"median": 118.00591979100001, "minimum": 113.642416333, "maximum": 132.363724958}, "native": {"median": 2.1112470420000005, "minimum": 1.870063958, "maximum": 2.230412875}}, "input": {"ratios": [29.029744399311827, 35.197627263150025, 31.985572730805, 26.496061664997516, 31.376167573236405], "median": 31.376167573236405, "range": [26.496061664997516, 35.197627263150025], "reference": {"median": 102.76645062499999, "minimum": 99.27519433299999, "maximum": 114.70002441700001}, "native": {"median": 3.2587430840000002, "minimum": 3.2129001250000004, "maximum": 3.7467905829999997}}};function draw(){const host=document.getElementById('chart');const w=Math.max(320,host.clientWidth),h=300,l=40,r=w-50,t=18,b=h-38;const x=i=>l+i/4*(r-l),y=v=>b-v/80*(b-t);let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="100%" height="300" role="img" aria-label="两项各五对交替测速"><g font-size="12" font-family="inherit">`;for(const v of [0,20,40,60,80])s+=`<line x1="${l}" x2="${r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border,#d7dee5)"/><text x="${l-9}" y="${y(v)+4}" text-anchor="end" fill="var(--muted-foreground,#657083)">${v}</text>`;for(let i=0;i<5;i++)s+=`<text x="${x(i)}" y="${b+22}" text-anchor="middle" fill="var(--foreground,#233044)">${i+1}</text>`;s+=`<text x="${l}" y="11" fill="var(--muted-foreground,#657083)">倍</text><text x="${r}" y="${h-2}" text-anchor="end" fill="var(--muted-foreground,#657083)">第几对</text>`;for(const [key,color,claim]of[['main','var(--chart-1,#2166ac)',65.35],['input','var(--chart-2,#9c6500)',45.91]]){s+=`<line x1="${l}" x2="${r}" y1="${y(claim)}" y2="${y(claim)}" stroke="${color}" stroke-dasharray="5 5" opacity=".6"/><text x="${r+6}" y="${y(claim)+4}" fill="${color}">${claim.toFixed(2)}</text><polyline points="${data[key].ratios.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5"/>`;data[key].ratios.forEach((v,i)=>s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${color}"><title>${key} 第 ${i+1} 对：${v.toFixed(2)} 倍</title></circle>`)}host.innerHTML=s+'</g></svg>'}new ResizeObserver(draw).observe(document.getElementById('chart'));draw();</script></body></html>
